name: Deploy bot to courtbot

on:
  push:
    branches: [discord-bot]
    # Docs and workflow edits do not change the running bot.
    paths-ignore:
      - "**.md"
      - ".github/**"

# One deploy at a time. A newer push waits for the running one.
concurrency:
  group: deploy-bot

jobs:
  deploy:
    # Label set when the runner is registered on the bot Mac. See README.
    runs-on: [self-hosted, courtbot]
    steps:
      # No checkout: the script deploys the bot's own checkout, not the runner's workspace.
      - run: bash "$HOME/projects/court-reserve-bot/scripts/autodeploy.sh"
